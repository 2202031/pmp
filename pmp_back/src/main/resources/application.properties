spring.application.name=pmp_back
spring.datasource.url=jdbc:mysql://localhost:3306/pmp_back?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC

# Tus credenciales de MySQL Server
spring.datasource.username=root
spring.datasource.password=root

# Driver y Dialecto para que Spring hable el "idioma" de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ddl-auto=update hace la magia de crear o actualizar tus tablas en MySQL según tus clases de Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true